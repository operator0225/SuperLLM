# 증류 파이프라인 설정

teacher:
  # 사용 가능 여부/이름은 API 콘솔에서 확인. logprobs 지원은 모델/엔드포인트별로 다름.
  model: "gemini-2.5-flash"        # 대안: "gemini-2.5-pro" (품질↑, 비용↑)
  temperature: 0.7
  max_output_tokens: 2048
  request_logprobs: true            # top-k logprobs를 함께 저장(보조 신호)
  top_logprobs: 20                  # Gemini 상한 = 20
  request_timeout_s: 120
  max_retries: 5

student:
  # 반드시 학습 가능한 bf16 체크포인트. q4_k_m GGUF가 아님!
  # LFM2.5 최소 크기는 350M (230M은 존재하지 않음). 정확한 repo id는 HF에서 확인.
  base_model: "LiquidAI/LFM2.5-350M"
  max_seq_len: 4096

data:
  seed_prompts: "distill/data/seed_prompts.jsonl"   # 줄당 {"prompt": "..."}
  teacher_out:  "distill/data/teacher_data.jsonl"
  system_prompt: "You are a helpful, concise assistant. Think step by step for hard problems."

train:
  output_dir: "distill/out/lfm2.5-350m-distill"
  epochs: 3
  lr: 2.0e-5
  per_device_batch_size: 4
  grad_accum: 8
  warmup_ratio: 0.03
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
  packing: true
  assistant_only_loss: true         # 손실은 assistant 토큰에만(프롬프트 제외)
  logging_steps: 10
  save_steps: 200

# --- 2b단계: cross-tokenizer 로짓 증류(ULD) 전용 설정 ---
distill_logit:
  # 오픈 웨이트 교사(전체 로짓 접근 가능). 정확한 repo id는 HF에서 확인.
  teacher_model: "google/gemma-4-E4B-it"   # 대안: google/gemma-4-E2B-it
  load_in_4bit: true            # 교사를 NF4로 로드(메모리↓). 질문의 "교사 4비트" = 여기.
  target_data: "distill/data/teacher_data.jsonl"   # 증류 대상 텍스트(1단계 산출물 재사용)
  output_dir: "distill/out/lfm2.5-350m-uld"
  alpha_hard: 0.5               # 총손실 = alpha*CE(hard) + (1-alpha)*ULD
  temperature: 2.0              # soft target 온도
  uld_top_k: 256                # ULD 정렬분포 truncation(연산량↓, 근사)
  epochs: 3
  lr: 1.0e-5
  grad_accum: 16                # micro-batch=1(정렬이 예제별) → 누적으로 유효 배치 확보
  max_seq_len: 2048
  logging_steps: 10

export:
  gguf_out: "distill/out/lfm2.5-350m-distill-q4_k_m.gguf"
  quant: "q4_k_m"
